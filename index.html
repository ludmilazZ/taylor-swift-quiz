<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylor Swift Quiz Game 🎵</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="start-screen" class="screen">
            <h1>Taylor Swift Quiz Game 🎵</h1>
            <p>Test your knowledge about Taylor's music, life, and career!</p>
            <button id="start-btn" class="btn">Start Quiz</button>
        </div>

        <div id="quiz-screen" class="screen hidden">
            <div class="header">
                <div id="progress">Question <span id="current-question">1</span>/<span id="total-questions">10</span></div>
                <div id="score">Score: <span id="score-value">0</span></div>
            </div>
            
            <div id="question-container">
                <h2 id="question-text"></h2>
                <div id="options-container"></div>
            </div>

            <div id="feedback" class="hidden"></div>
        </div>

        <div id="end-screen" class="screen hidden">
            <h2>Quiz Complete! 🎉</h2>
            <p>Your final score: <span id="final-score">0</span>/<span id="max-score">10</span></p>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
